name: Cleanup Orphans (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Actually delete files (unchecked = dry run only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup-orphans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run orphan cleanup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" = "true" ]; then
            node scripts/cleanup-orphans.mjs --confirm
          else
            node scripts/cleanup-orphans.mjs
          fi

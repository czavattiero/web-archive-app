name: Daily Failed Captures Report

on:
  schedule:
    # 7 PM Alberta time. GitHub cron is UTC-only, so both offsets are scheduled
    # and the script skips whichever one doesn't match the current DST state.
    - cron: "0 1 * * *"   # 01:00 UTC = 7 PM MDT (summer)
    - cron: "0 2 * * *"   # 02:00 UTC = 7 PM MST (winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Send failed captures report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: node worker/failureReport.js

name: Web Archive Capture Worker

on:
  schedule:
    - cron: "45 15 * * *"   # Daily at 15:45 UTC (≈ 09:45 Alberta MDT)
  workflow_dispatch:
    inputs:
      capture_mode:
        description: 'IMMEDIATE (new URLs) or SCHEDULED (due URLs)'
        required: false
        default: "SCHEDULED"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Validate worker syntax
        run: node --check worker/*.js

      - name: Lint worker files
        run: npx eslint worker/

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run capture worker
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: node worker/capture.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          CAPTURE_MODE: ${{ github.event.inputs.capture_mode || 'SCHEDULED' }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
